<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لذّة الخلية | مخبوزات وفطاير</title>
    <!-- ربط ملف التصميم الخارجي -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- نافذة اختيار الفرع -->
    <div id="branch-modal" class="modal">
        <div class="modal-content">
            <h2>اختر الفرع الأقرب إليك</h2>
            <p>لخدمتك بشكل أسرع وعرض المنتجات المتاحة:</p>
            <div id="branches-list"></div>
        </div>
    </div>

    <!-- الترويسة -->
    <header>
        <div class="container header-content">
            <h1 class="logo">🍯 لذّة الخلية</h1>
            <div class="header-actions">
                <span id="current-branch-label" class="badge">الفرع: لم يُحدد</span>
                <button onclick="openCart()" class="btn">🛒 السلة (<span id="cart-count">0</span>)</button>
                <button onclick="openAdmin()" class="btn outline">⚙️ الإدارة</button>
            </div>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="container">
        <!-- شريط الأقسام -->
        <div id="categories-bar" class="categories-bar"></div>

        <!-- قائمة المنتجات -->
        <section>
            <h2>قائمة المنتجات</h2>
            <div id="products-grid" class="products-grid"></div>
        </section>
    </main>

    <!-- نافذة السلة وحجز الطلب -->
    <div id="cart-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close" onclick="closeCart()">&times;</span>
            <h2>سلة المشتريات</h2>
            <div id="cart-items"></div>
            <div id="cart-total"></div>
            <div class="checkout-form">
                <input type="text" id="customer-phone" placeholder="رقم الجوال لتأكيد الحجز (مثال: 05xxxxxxxx)">
                <button onclick="checkout()" class="btn primary full">تأكيد حجز الطلب</button>
            </div>
            <div id="timer-box" class="hidden">
                <p>متبقي على انتهاء الحجز المؤقت: <span id="countdown">15:00</span></p>
            </div>
        </div>
    </div>

    <!-- لوحة الإدارة البسيطة -->
    <div id="admin-modal" class="modal hidden">
        <div class="modal-content large">
            <span class="close" onclick="closeAdmin()">&times;</span>
            <h2>لوحة الإدارة والموظفين</h2>
            <div class="admin-tabs">
                <button onclick="switchAdminTab('products')" class="btn">إدارة المنتجات</button>
                <button onclick="switchAdminTab('orders')" class="btn">متابعة الحجوزات</button>
            </div>
            <div id="admin-body"></div>
        </div>
    </div>

    <!-- ربط ملف الوظائف والبرمجة -->
    <script src="script.js"></script>
</body>
</html>
