<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لذّة الخلية | مخبوزات، فطاير، كيكات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --brown-950:#2A1D14;
    --brown-800:#4A3524;
    --brown-600:#7A5A3C;
    --brown-400:#A8815A;
    --tan-200:#EDE0CB;
    --tan-100:#F6EFE2;
    --cream:#FBF7EF;
    --white:#FFFFFF;
    --ok:#4C7A55;
    --ok-bg:#E7F0E5;
    --warn:#A6432F;
    --warn-bg:#F5E6E1;
    --radius:16px;
    --shadow:0 6px 18px rgba(42,29,20,0.10);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:var(--cream); color:var(--brown-950);}
  body{ font-family:'Lalezar','Tajawal',sans-serif; line-height:1.9; min-height:100vh; position:relative; }
  button, input, select{ font-family:'Lalezar','Tajawal',sans-serif; }
  img{max-width:100%; display:block;}
  button{cursor:pointer; border:none;}
  a{color:inherit;}
  :focus-visible{ outline:3px solid var(--brown-600); outline-offset:2px; }

  .page-wrap{ max-width:960px; margin:0 auto; }
  .chooser-screen{ min-height:100vh; background:var(--brown-950); color:var(--tan-100); display:flex; flex-direction:column; align-items:center; padding:60px 22px 40px; }
  .chooser-screen h1{ font-size:2.4rem; margin-bottom:6px; text-align:center; }
  .chooser-screen .sub{ color:var(--tan-200); margin-bottom:34px; text-align:center; font-size:1.05rem; }
  .branch-pick{ width:100%; max-width:420px; background:var(--white); color:var(--brown-950); border-radius:14px; padding:18px 20px; margin-bottom:14px; text-align:right; box-shadow:var(--shadow); display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .branch-pick .bp-name{ font-size:1.25rem; }
  .branch-pick .bp-arrow{ font-size:1.3rem; color:var(--brown-400); }
  .chooser-empty{ color:var(--tan-200); text-align:center; margin-top:20px; }

  .site-header{ background:var(--brown-950); color:var(--tan-100); padding:22px 20px 18px; text-align:center; position:relative; }
  .site-header .menu-btn{ position:absolute; top:18px; left:16px; width:42px; height:42px; border-radius:10px; background:rgba(255,255,255,0.08); color:var(--tan-100); font-size:20px; display:flex; align-items:center; justify-content:center; }
  .site-header .menu-btn span{display:block; width:20px; height:2px; background:var(--tan-100); position:relative;}
  .site-header .menu-btn span::before, .site-header .menu-btn span::after{ content:""; position:absolute; right:0; width:20px; height:2px; background:var(--tan-100); }
  .site-header .menu-btn span::before{ top:-6px; }
  .site-header .menu-btn span::after{ top:6px; }
  .site-header h1{ font-size:2.3rem; letter-spacing:1px; }
  .site-header p{ color:var(--tan-200); font-size:0.95rem; margin-top:4px; }

  .branch-bar{ background:var(--brown-800); color:var(--tan-100); display:flex; align-items:center; justify-content:space-between; padding:11px 18px; font-size:0.98rem; gap:8px; flex-wrap:wrap; }
  .branch-bar .bb-name{ display:flex; align-items:center; gap:6px; }
  .branch-bar button, .branch-bar a{ background:rgba(255,255,255,0.12); color:var(--tan-100); border-radius:8px; padding:6px 12px; font-size:0.9rem; text-decoration:none; }

  .hero{ margin:18px 16px 8px; border-radius:var(--radius); background:linear-gradient(135deg, var(--brown-800), var(--brown-600)); color:var(--white); padding:26px 24px; text-align:center; box-shadow:var(--shadow); }
  .hero h2{ font-size:1.35rem; font-weight:normal; }
  .hero p{ font-size:0.95rem; color:var(--tan-100); margin-top:6px; }
  .hero-dots{ display:flex; gap:6px; justify-content:center; margin-top:12px; }
  .hero-dots span{ width:8px; height:8px; border-radius:50%; background:rgba(255,255,255,0.35); }
  .hero-dots span.active{ background:var(--white); }

  .cat-nav{ display:flex; gap:10px; overflow-x:auto; padding:14px 16px; }
  .cat-nav::-webkit-scrollbar{ height:0; }
  .cat-chip{ white-space:nowrap; background:var(--white); border:1.5px solid var(--tan-200); color:var(--brown-800); padding:9px 18px; border-radius:999px; font-size:1rem; }

  .cat-section{ padding:6px 16px 22px; }
  .cat-section h3{ font-size:1.5rem; color:var(--brown-950); margin-bottom:12px; border-right:5px solid var(--brown-400); padding-right:10px; }
  .product-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:14px; }
  @media(min-width:640px){ .product-grid{ grid-template-columns:repeat(3,1fr);} }
  @media(min-width:960px){ .product-grid{ grid-template-columns:repeat(4,1fr);} }
  .product-card{ background:var(--white); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow); display:flex; flex-direction:column; }
  .product-card .thumb{ height:110px; display:flex; align-items:center; justify-content:center; font-size:2.6rem; background:var(--tan-100); }
  .product-card .thumb img{ width:100%; height:100%; object-fit:cover; }
  .product-card .info{ padding:12px 14px 14px; display:flex; flex-direction:column; gap:5px; flex:1; }
  .product-card .name{ font-size:1.15rem; color:var(--brown-950); }
  .product-card .desc{ font-size:0.76rem; color:var(--brown-400); line-height:1.4; }
  .product-card .price{ color:var(--brown-600); font-size:1rem; }
  .product-card .stock-note{ font-size:0.85rem; color:var(--brown-400); }
  .product-card .stock-note.out{ color:var(--warn); }
  .qty-row{ display:flex; align-items:center; justify-content:space-between; margin-top:auto; gap:8px; }
  .qty-row button{ width:32px; height:32px; border-radius:8px; background:var(--tan-100); color:var(--brown-800); font-size:1.1rem; }
  .qty-row .qty-val{ min-width:22px; text-align:center; font-size:1.05rem; }
  .add-btn{ background:var(--brown-800); color:var(--white); border-radius:10px; padding:9px 0; font-size:1rem; margin-top:8px; }
  .add-btn:disabled{ background:var(--tan-200); color:var(--brown-400); }
  .empty-note{ text-align:center; color:var(--brown-400); padding:30px 10px; font-size:1.05rem; }

  .cart-fab{ position:fixed; left:18px; bottom:18px; z-index:40; background:var(--brown-950); color:var(--white); border-radius:999px; padding:14px 22px; display:flex; align-items:center; gap:10px; box-shadow:var(--shadow); font-size:1.05rem; }
  .cart-fab .badge{ background:var(--white); color:var(--brown-950); border-radius:50%; width:24px; height:24px; display:flex; align-items:center; justify-content:center; font-size:0.85rem; }

  .site-footer{ text-align:center; color:var(--tan-200); font-size:0.78rem; padding:26px 10px 90px; user-select:none; background:transparent; }

  .toast{ position:fixed; top:16px; left:50%; transform:translateX(-50%); z-index:99; padding:12px 22px; border-radius:12px; font-size:0.95rem; box-shadow:var(--shadow); max-width:90vw; text-align:center; }
  .toast.success{ background:var(--ok-bg); color:var(--ok); }
  .toast.error{ background:var(--warn-bg); color:var(--warn); }

  .overlay{ position:fixed; inset:0; background:rgba(42,29,20,0.55); z-index:85; display:flex; align-items:flex-end; justify-content:center; }
  @media(min-width:720px){ .overlay{ align-items:center; } }
  .sheet{ background:var(--cream); width:100%; max-width:480px; max-height:88vh; overflow-y:auto; border-radius:20px 20px 0 0; padding:22px 20px 26px; position:relative; }
  @media(min-width:720px){ .sheet{ border-radius:20px; } }
  .sheet h2{ font-size:1.5rem; color:var(--brown-950); margin-bottom:14px; }
  .sheet .close-x{ position:absolute; top:14px; left:16px; background:var(--tan-100); color:var(--brown-800); width:34px; height:34px; border-radius:50%; font-size:1.1rem; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:0.95rem; color:var(--brown-600); margin-bottom:6px; }
  .field input, .field select{ width:100%; padding:11px 14px; border-radius:10px; border:1.5px solid var(--tan-200); font-size:1.05rem; background:var(--white); color:var(--brown-950); }
  .btn-primary{ width:100%; background:var(--brown-800); color:var(--white); padding:13px 0; border-radius:12px; font-size:1.1rem; margin-top:6px; }
  .btn-primary:disabled{ background:var(--tan-200); color:var(--brown-400); }
  .btn-secondary{ width:100%; background:var(--tan-100); color:var(--brown-800); padding:12px 0; border-radius:12px; font-size:1rem; margin-top:8px; }
  .error-msg{ color:var(--warn); font-size:0.9rem; margin-top:-6px; margin-bottom:10px; }

  .cart-line{ display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--tan-200); }
  .cart-line .thumb-sm{ width:52px; height:52px; border-radius:10px; background:var(--tan-100); display:flex; align-items:center; justify-content:center; font-size:1.6rem; flex-shrink:0;}
  .cart-line .meta{ flex:1; }
  .cart-line .meta .n{ font-size:1.05rem; }
  .cart-line .meta .p{ font-size:0.9rem; color:var(--brown-600); }
  .cart-total{ display:flex; justify-content:space-between; padding:14px 0; font-size:1.1rem; color:var(--brown-950); }

  .banner-badge{ display:inline-block; background:var(--ok-bg); color:var(--ok); padding:4px 12px; border-radius:999px; font-size:0.9rem; margin-bottom:8px; }
  .code-display{ text-align:center; font-size:2.2rem; letter-spacing:2px; color:var(--brown-800); background:var(--tan-100); border-radius:12px; padding:16px; margin:14px 0; }

  .drawer-overlay{ position:fixed; inset:0; background:rgba(42,29,20,0.5); z-index:70; display:flex; justify-content:flex-end; }
  .drawer{ background:var(--cream); width:82%; max-width:320px; height:100%; padding:20px; overflow-y:auto; }
  .drawer h2{ font-size:1.4rem; color:var(--brown-950); margin-bottom:16px; }
  .drawer .role-tag{ display:inline-block; background:var(--brown-800); color:var(--white); font-size:0.85rem; padding:3px 12px; border-radius:999px; margin-bottom:16px; }
  .drawer-item{ display:block; width:100%; text-align:right; background:var(--white); border-radius:12px; padding:16px; margin-bottom:10px; font-size:1.1rem; color:var(--brown-950); box-shadow:var(--shadow); }
  .drawer-item.logout{ background:var(--warn-bg); color:var(--warn); }

  .admin-panel{ position:fixed; inset:0; background:var(--cream); z-index:65; overflow-y:auto; }
  .panel-header{ background:var(--brown-950); color:var(--white); padding:18px 16px; display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:2; }
  .panel-header button{ background:rgba(255,255,255,0.1); color:var(--white); width:38px; height:38px; border-radius:10px; font-size:1.2rem; }
  .panel-header h2{ font-size:1.3rem; }
  .panel-body{ padding:18px 16px 40px; max-width:900px; margin:0 auto; }
  .stat-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-bottom:20px; }
  .stat-card{ background:var(--white); border-radius:14px; padding:16px; text-align:center; box-shadow:var(--shadow); }
  .stat-card .num{ font-size:1.8rem; color:var(--brown-800); }
  .stat-card .lbl{ font-size:0.9rem; color:var(--brown-600); }
  .list-row{ background:var(--white); border-radius:14px; padding:14px 16px; margin-bottom:10px; box-shadow:var(--shadow); display:flex; align-items:center; justify-content:space-between; gap:10px; width:100%; }
  .list-row .l-main{ flex:1; min-width:0; }
  .list-row .l-main .t1{ font-size:1.1rem; }
  .list-row .l-main .t2{ font-size:0.9rem; color:var(--brown-600); word-break:break-word; }
  .icon-btn{ background:var(--tan-100); color:var(--brown-800); width:36px; height:36px; border-radius:10px; font-size:1.1rem; flex-shrink:0; }
  .icon-btn.danger{ background:var(--warn-bg); color:var(--warn); }
  .section-title{ font-size:1.2rem; color:var(--brown-800); margin:18px 0 10px; }
  .order-items{ font-size:0.9rem; color:var(--brown-600); margin-top:4px; }
  table{ width:100%; border-collapse:collapse; background:var(--white); border-radius:14px; overflow:hidden; box-shadow:var(--shadow); }
  th,td{ padding:10px 12px; text-align:right; font-size:0.9rem; border-bottom:1px solid var(--tan-100); }
  th{ background:var(--tan-100); color:var(--brown-800); }

  .cropper-overlay{ position:fixed; inset:0; background:rgba(0,0,0,0.88); z-index:90; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; }
  .crop-hint{ color:var(--tan-200); font-size:0.9rem; margin-bottom:14px; text-align:center; }
  .crop-frame{ position:relative; width:280px; height:280px; overflow:hidden; border:2px solid var(--white); background:#111; touch-action:none; }
  .crop-frame img{ position:absolute; top:50%; left:50%; user-select:none; }
  .corner{ position:absolute; width:22px; height:22px; pointer-events:none; }
  .corner.tl{ top:-2px; left:-2px; border-top:3px solid var(--white); border-left:3px solid var(--white); }
  .corner.tr{ top:-2px; right:-2px; border-top:3px solid var(--white); border-right:3px solid var(--white); }
  .corner.bl{ bottom:-2px; left:-2px; border-bottom:3px solid var(--white); border-left:3px solid var(--white); }
  .corner.br{ bottom:-2px; right:-2px; border-bottom:3px solid var(--white); border-right:3px solid var(--white); }
</style>
</head>
<body>
<div id="app"></div>

<script>
const CATEGORY_ICONS = { 'خبز ومعجنات':'🥐', 'فطاير':'🥧', 'كيك':'🎂', 'حلويات':'🍬' };
const STORAGE_KEY = 'lathat-alkhaleya-data-v5';
const CROP=280, OUT=500;

let state = {
  data: defaultData(),
  cart: {},
  admin: null,
  selectedBranchId: null,
  modal: null,
  drawerOpen:false,
  adminPanel:null,
  formModal:null,
  toast:null,
  cropper:null,
  pendingImageData:'',
  heroIndex:0,
  reserveDraft:{name:'', phone:''},
  employeeSearchPhone:'',
  employeeSearchResults:[],
  formError:'',
  footerTaps:0,
  footerTapTimer:null,
  loaded:false,
};

function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,9); }

function defaultData(){
  const branches = [
    {id:'br1', name:'فرع حي النورية', mapsUrl:'https://www.google.com/maps/search/?api=1&query=%D9%81%D8%B1%D8%B9+%D8%AD%D9%8A+%D8%A7%D9%84%D9%86%D9%88%D8%B1%D9%8A%D8%A9+%D9%85%D9%83%D8%A9', employeeCode:'2222'},
    {id:'br2', name:'فرع العزيزية', mapsUrl:'https://www.google.com/maps/search/?api=1&query=%D9%81%D8%B1%D8%B9+%D8%A7%D9%84%D8%B9%D8%B2%D9%8A%D8%B2%D9%8A%D8%A9+%D9%85%D9%83%D8%A9', employeeCode:'4444'},
  ];
  const categories = [
    {id:'c1', name:'خبز ومعجنات', branchId:'br1'},
    {id:'c2', name:'فطاير', branchId:'br1'},
    {id:'c3', name:'كيك', branchId:'br1'},
    {id:'c4', name:'حلويات', branchId:'br1'},
    {id:'c5', name:'خبز ومعجنات', branchId:'br2'},
    {id:'c6', name:'فطاير', branchId:'br2'},
    {id:'c7', name:'كيك', branchId:'br2'},
    {id:'c8', name:'حلويات', branchId:'br2'},
  ];
  const products = [
    {id:uid('p'), name:'كرواسان زبدة', categoryId:'c1', branchId:'br1', price:8, stock:25, image:'', desc:'زبدة فرنسية طازجة يوميًا'},
    {id:uid('p'), name:'رول القرفة', categoryId:'c1', branchId:'br1', price:10, stock:18, image:'', desc:''},
    {id:uid('p'), name:'فطيرة جبن', categoryId:'c2', branchId:'br1', price:12, stock:20, image:'', desc:'جبنة موزاريلا مشوية'},
    {id:uid('p'), name:'فطيرة سبانخ', categoryId:'c2', branchId:'br1', price:12, stock:15, image:'', desc:''},
    {id:uid('p'), name:'كيك الشوكولاتة', categoryId:'c3', branchId:'br1', price:90, stock:6, image:'', desc:''},
    {id:uid('p'), name:'فطيرة لحم', categoryId:'c6', branchId:'br2', price:15, stock:12, image:'', desc:''},
    {id:uid('p'), name:'كيك فانيليا بالفراولة', categoryId:'c7', branchId:'br2', price:95, stock:5, image:'', desc:''},
    {id:uid('p'), name:'كنافة نابلسية', categoryId:'c8', branchId:'br2', price:14, stock:20, image:'', desc:'قشطة طازجة وقطر بارد'},
    {id:uid('p'), name:'بقلاوة مشكلة (صندوق)', categoryId:'c8', branchId:'br2', price:35, stock:10, image:'', desc:''},
  ];
  const banners = [ {id:uid('b'), title:'عروض المخبوزات الطازجة', subtitle:'اطلبها الآن واستلمها من الفرع', branchIds:['br1','br2']} ];
  return { branches, categories, products, banners, orders:[], settings:{ managerCode:'1111', reservationMinutes:45, orderCounter:1000 } };
}

function loadData(){
  try{
    const local = localStorage.getItem(STORAGE_KEY);
    if(local){
      const parsed = JSON.parse(local);
      if(parsed && parsed.settings) {
        state.data = parsed;
      }
    } else {
      saveData();
    }
  }catch(e){
    console.error(e);
  }
  state.loaded = true;
  render();
}

function saveData(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data));
  }catch(e){
    console.error("Storage error:", e);
  }
}

function showToast(text, type){
  state.toast = {text, type: type||'success'};
  render();
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>{ state.toast = null; render(); }, 2600);
}

function render(){
  if(!state.loaded){ document.getElementById('app').innerHTML = '<div style="padding:60px 20px;text-align:center;color:#7A5A3C;">جاري التحميل…</div>'; return; }
  if(!state.selectedBranchId){ document.getElementById('app').innerHTML = renderBranchChooser(); return; }
  let html = '<div class="page-wrap">';
  html += renderHeader();
  html += renderBranchBar();
  html += renderHero();
  html += renderCategoryNav();
  html += renderProductSections();
  html += renderFooter();
  html += '</div>';
  html += renderCartFab();
  if(state.modal) html += renderModal();
  if(state.drawerOpen) html += renderDrawer();
  if(state.adminPanel) html += renderAdminPanel();
  if(state.formModal) html += renderFormModal();
  if(state.cropper) html += renderCropper();
  if(state.toast) html += `<div class="toast ${state.toast.type}">${escapeHtml(state.toast.text)}</div>`;
  document.getElementById('app').innerHTML = html;
}

function renderBranchChooser(){
  const branches = state.data.branches;
  const list = branches.map(b=>`<button class="branch-pick" onclick="selectBranch('${b.id}')"><span class="bp-name">📍 ${escapeHtml(b.name)}</span><span class="bp-arrow">‹</span></button>`).join('') || `<div class="chooser-empty">لا توجد فروع مضافة بعد</div>`;
  return `<div class="chooser-screen"><h1>لذّة الخلية</h1><p class="sub">اختر الفرع الأقرب إليك لعرض منتجاته</p>${list}
    <div class="site-footer" onclick="handleFooterTap()" style="color:var(--tan-200); opacity:0.7; margin-top:26px;">© لذّة الخلية</div></div>`;
}
function selectBranch(branchId){ state.selectedBranchId = branchId; state.heroIndex = 0; render(); }
function changeBranch(){
  if(state.admin && state.admin.role==='employee'){ state.admin=null; state.adminPanel=null; state.drawerOpen=false; state.formModal=null; }
  state.selectedBranchId = null; state.cart = {}; state.heroIndex = 0; render();
}
function activeBranchId(){ return state.admin && state.admin.role==='manager' ? state.selectedBranchId : (state.admin ? state.admin.branchId : state.selectedBranchId); }

function renderHeader(){
  const menuBtn = state.admin ? `<button class="menu-btn" onclick="toggleDrawer()"><span></span></button>` : '';
  return `<header class="site-header">${menuBtn}<h1>لذّة الخلية</h1><p>خلية • سينابون • سنبوسة</p></header>`;
}
function renderBranchBar(){
  const b = state.data.branches.find(x=>x.id===state.selectedBranchId);
  if(!b) return '';
  return `<div class="branch-bar"><span class="bb-name">📍 ${escapeHtml(b.name)}</span>
    <div style="display:flex; gap:8px;"><a href="${escapeAttr(b.mapsUrl)}" target="_blank" rel="noopener">الموقع 🗺️</a><button onclick="changeBranch()">تغيير الفرع</button></div></div>`;
}
function branchBanners(){ return state.data.banners.filter(b=>Array.isArray(b.branchIds) && b.branchIds.includes(state.selectedBranchId)); }
function renderHero(){
  const banners = branchBanners();
  if(!banners.length) return '';
  const idx = state.heroIndex % banners.length;
  const b = banners[idx];
  const dots = banners.map((_,i)=>`<span class="${i===idx?'active':''}"></span>`).join('');
  return `<section class="hero"><h2>${escapeHtml(b.title)}</h2>${b.subtitle?`<p>${escapeHtml(b.subtitle)}</p>`:''}${banners.length>1?`<div class="hero-dots">${dots}</div>`:''}</section>`;
}

function branchProducts(){ return state.data.products.filter(p=>p.branchId===state.selectedBranchId); }
function branchCategories(branchId){ return state.data.categories.filter(c=>c.branchId===branchId); }
function renderCategoryNav(){
  const items = branchProducts();
  const cats = branchCategories(state.selectedBranchId).filter(c=>items.some(p=>p.categoryId===c.id));
  const chips = cats.map(c=>`<button class="cat-chip" onclick="scrollToCat('${c.id}')">${escapeHtml(c.name)}</button>`).join('');
  return `<nav class="cat-nav">${chips}</nav>`;
}
function scrollToCat(catId){ const el = document.getElementById('cat-'+catId); if(el) el.scrollIntoView({behavior:'smooth', block:'start'}); }
function renderProductSections(){
  const items = branchProducts();
  if(!items.length) return `<div class="empty-note">لا توجد منتجات مضافة لهذا الفرع بعد</div>`;
  const cats = branchCategories(state.selectedBranchId);
  return cats.map(cat=>{
    const catItems = items.filter(p=>p.categoryId===cat.id);
    if(!catItems.length) return '';
    const cards = catItems.map(p=>renderProductCard(p, cat)).join('');
    return `<section class="cat-section" id="cat-${cat.id}"><h3>${escapeHtml(cat.name)}</h3><div class="product-grid">${cards}</div></section>`;
  }).join('');
}
function renderProductCard(p, cat){
  const qty = state.cart[p.id] || 0;
  const out = p.stock <= 0;
  const thumb = p.image ? `<img src="${escapeAttr(p.image)}" alt="${escapeAttr(p.name)}">` : (CATEGORY_ICONS[cat.name] || '🍰');
  return `
  <div class="product-card">
    <div class="thumb">${thumb}</div>
    <div class="info">
      <div class="name">${escapeHtml(p.name)}</div>
      ${p.desc?`<div class="desc">${escapeHtml(p.desc)}</div>`:''}
      <div class="price">${p.price} ر.س</div>
      <div class="stock-note ${out?'out':''}">${out ? 'غير متوفر حاليًا' : 'المتاح: '+p.stock}</div>
      ${qty>0 ? `<div class="qty-row"><button onclick="changeQty('${p.id}', -1)">−</button><span class="qty-val">${qty}</span><button onclick="changeQty('${p.id}', 1)" ${qty>=p.stock?'disabled':''}>+</button></div>`
              : `<button class="add-btn" onclick="changeQty('${p.id}', 1)" ${out?'disabled':''}>${out?'غير متوفر':'إضافة للسلة'}</button>`}
    </div>
  </div>`;
}
function changeQty(productId, delta){
  const p = state.data.products.find(x=>x.id===productId);
  if(!p) return;
  const cur = state.cart[productId] || 0;
  let next = cur + delta;
  if(next < 0) next = 0;
  if(next > p.stock) next = p.stock;
  if(next === 0) delete state.cart[productId]; else state.cart[productId] = next;
  render();
}
function cartCount(){ return Object.values(state.cart).reduce((a,b)=>a+b,0); }
function renderCartFab(){
  const count = cartCount();
  return `<button class="cart-fab" onclick="openModal('cart')">🧺 السلة ${count>0?`<span class="badge">${count}</span>`:''}</button>`;
}
function renderFooter(){ return `<div class="site-footer" onclick="handleFooterTap()">© لذّة الخلية</div>`; }
function handleFooterTap(){
  state.footerTaps++;
  clearTimeout(state.footerTapTimer);
  state.footerTapTimer = setTimeout(()=>{ state.footerTaps = 0; }, 2500);

function modalCart(){
  const items = Object.entries(state.cart).map(([pid,qty])=>{
    const p = state.data.products.find(x=>x.id===pid);
    if(!p) return '';
    const cat = state.data.categories.find(c=>c.id===p.categoryId);
    return `<div class="cart-line"><div class="thumb-sm">${CATEGORY_ICONS[cat?cat.name:'']||'🍰'}</div>
      <div class="meta"><div class="n">${escapeHtml(p.name)}</div><div class="p">${p.price} ر.س × ${qty}</div></div>
      <button class="icon-btn" onclick="changeQty('${p.id}',-1)">−</button><span>${qty}</span>
      <button class="icon-btn" onclick="changeQty('${p.id}',1)" ${qty>=p.stock?'disabled':''}>+</button></div>`;
  }).join('');
  const count = cartCount();
  const total = Object.entries(state.cart).reduce((sum,[pid,qty])=>{ const p = state.data.products.find(x=>x.id===pid); return sum + (p?p.price*qty:0); },0);
  const body = count===0 ? `<div class="empty-note">سلتك فارغة، أضف بعض المنتجات الشهية 🧁</div>` : `${items}<div class="cart-total"><span>الإجمالي</span><span>${total} ر.س</span></div>`;
  return modalWrap(`<button class="close-x" onclick="closeModal()">✕</button><h2>سلتك</h2>${body}

}

function submitReserveConfirm(){
  const val = document.getElementById('rf-phone-confirm').value.trim();
  if(val !== state.reserveDraft.phone){ state.formError = 'رقم الهاتف غير متطابق، حاول مرة أخرى'; render(); return; }
  const items = Object.entries(state.cart).map(([pid,qty])=>({productId:pid, qty}));
  for(const it of items){ const p = state.data.products.find(x=>x.id===it.productId); if(p) p.stock = Math.max(0, p.stock - it.qty); }
  const minutes = state.data.settings.reservationMinutes || 45;
  const orderNumber = ++state.data.settings.orderCounter;
  const order = { id: uid('o'), number: orderNumber, name: state.reserveDraft.name, phone: state.reserveDraft.phone,
    branchId: state.selectedBranchId, items, createdAt: Date.now(), expiresAt: Date.now() + minutes*60000, status: 'pending' };

  state.cart = {};
  state.lastOrder = order;
  saveData();
  state.modal = 'success';
  render();
}

    <button class="btn-primary" onclick="submitAdminLogin()">دخول</button>`);

function submitAdminLogin(){
  const codeEl = document.getElementById('admin-code'); if(!codeEl) return;
  const code = codeEl.value.trim();
  if(!/^[0-9]{4}$/.test(code)){ state.formError = 'أدخل كودًا مكونًا من 4 أرقام'; render(); return; }
  if(state.data.settings.managerCode && code === state.data.settings.managerCode){
    state.admin = {role:'manager'};
    state.modal = null; render(); return;
  }
  let foundBranch=null;
  for(const br of state.data.branches){ if(br.employeeCode && code===br.employeeCode){ foundBranch=br; break; } }
  if(!foundBranch){ state.formError = 'الكود غير صحيح'; render(); return; }
  if(foundBranch.id !== state.selectedBranchId){
    state.formError = 'أنت مسجّل في ' + foundBranch.name + ' — غيّر الفرع من الموقع ثم سجّل الدخول';
    render(); return;
  }
  state.admin = {role:'employee', branchId:foundBranch.id};
  state.modal = null; render();
}

function imagePickerHtml(){
  return `<div class="field"><label>صورة المنتج</label>
    <div style="display:flex; align-items:center; gap:12px;">
      <div style="width:64px;height:64px;border-radius:10px;overflow:hidden;background:var(--tan-100);display:flex;align-items:center;justify-content:center;font-size:1.8rem;flex-shrink:0;">
        ${state.pendingImageData ? `<img src="${state.pendingImageData}" style="width:100%;height:100%;object-fit:cover;">` : '🍰'}
      </div>
      <label class="btn-secondary" style="margin:0; text-align:center; cursor:pointer; flex:1;">📷 التقاط / اختيار صورة
        <input type="file" accept="image/*" style="display:none" onchange="handleImageSelect(event)">
      </label>
    </div></div>`;
}
function handleImageSelect(event){
  const file = event.target.files && event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      state.cropper = { dataUrl:e.target.result, naturalW:img.naturalWidth, naturalH:img.naturalHeight, zoom:1, offsetX:0, offsetY:0 };
      render();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
  event.target.value = '';
}
function cropDims(){
  const c = state.cropper;
  const baseScale = Math.max(CROP/c.naturalW, CROP/c.naturalH);
  const scale = baseScale * c.zoom;
  return { scale, dispW:c.naturalW*scale, dispH:c.naturalH*scale };
}
function renderCropper(){
  const c = state.cropper;
  const {dispW, dispH} = cropDims();
  return `<div class="cropper-overlay">
    <div class="crop-hint">اسحب لتحريك الصورة، واستخدم الشريط للتكبير — ثم اضغط "تم"</div>
    <div class="crop-frame" id="crop-frame"
      onmousedown="cropDragStart(event)" onmousemove="cropDragMove(event)" onmouseup="cropDragEnd(event)" onmouseleave="cropDragEnd(event)"
      ontouchstart="cropDragStart(event)" ontouchmove="cropDragMove(event)" ontouchend="cropDragEnd(event)">
      <img id="crop-img" src="${c.dataUrl}" draggable="false" style="width:${dispW}px; height:${dispH}px; transform:translate(calc(-50% + ${c.offsetX}px), calc(-50% + ${c.offsetY}px));">
      <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
    </div>
    <div style="width:280px; margin-top:16px;"><input type="range" min="1" max="2.5" step="0.05" value="${c.zoom}" oninput="cropZoom(this.value)" style="width:100%;"></div>
    <div style="display:flex; gap:10px; width:280px; margin-top:16px;">
      <button class="btn-secondary" style="flex:1; margin-top:0;" onclick="cancelCrop()">إلغاء</button>
      <button class="btn-primary" style="flex:1; margin-top:0;" onclick="confirmCrop()">تم</button>
    </div>
  </div>`;
}
let cropDrag = null;
function getPoint(e){ if(e.touches && e.touches[0]) return {x:e.touches[0].clientX, y:e.touches[0].clientY}; return {x:e.clientX, y:e.clientY}; }
function cropDragStart(e){ e.preventDefault(); const p = getPoint(e); cropDrag = { startX:p.x, startY:p.y, baseX:state.cropper.offsetX, baseY:state.cropper.offsetY }; }
function cropDragMove(e){
  if(!cropDrag || !state.cropper) return;
  e.preventDefault();
  const p = getPoint(e);
  const dx = p.x - cropDrag.startX, dy = p.y - cropDrag.startY;
  const c = state.cropper;
  const {dispW, dispH} = cropDims();
  const maxOX = Math.max(0,(dispW-CROP)/2), maxOY = Math.max(0,(dispH-CROP)/2);
  c.offsetX = Math.max(-maxOX, Math.min(maxOX, cropDrag.baseX + dx));
  c.offsetY = Math.max(-maxOY, Math.min(maxOY, cropDrag.baseY + dy));
  const img = document.getElementById('crop-img');
  if(img) img.style.transform = `translate(calc(-50% + ${c.offsetX}px), calc(-50% + ${c.offsetY}px))`;
}
function cropDragEnd(){ cropDrag = null; }
function cropZoom(val){
  const c = state.cropper; c.zoom = parseFloat(val);
  const {dispW, dispH} = cropDims();
  const maxOX = Math.max(0,(dispW-CROP)/2), maxOY = Math.max(0,(dispH-CROP)/2);
  c.offsetX = Math.max(-maxOX, Math.min(maxOX, c.offsetX));
  c.offsetY = Math.max(-maxOY, Math.min(maxOY, c.offsetY));
  render();
}
function cancelCrop(){ state.cropper = null; render(); }
function confirmCrop(){
  const c = state.cropper;
  const {scale, dispW, dispH} = cropDims();
  const cropDispX = (dispW-CROP)/2 - c.offsetX;
  const cropDispY = (dispH-CROP)/2 - c.offsetY;
  const srcX = cropDispX/scale, srcY = cropDispY/scale, srcSize = CROP/scale;
  const canvas = document.createElement('canvas');
  canvas.width = OUT; canvas.height = OUT;
  const ctx = canvas.getContext('2d');
  const img = document.getElementById('crop-img');
  ctx.drawImage(img, srcX, srcY, srcSize, srcSize, 0, 0, OUT, OUT);
  state.pendingImageData = canvas.toDataURL('image/jpeg', 0.85);
  state.cropper = null;
  render();
}

function saveProduct(productId){
  const name = document.getElementById('pf-name').value.trim();
  const categoryId = document.getElementById('pf-cat').value;
  const price = parseFloat(document.getElementById('pf-price').value) || 0;
  const stock = parseInt(document.getElementById('pf-stock').value) || 0;
  const desc = document.getElementById('pf-desc').value.trim().slice(0,30);
  const image = state.pendingImageData || '';
  if(!name){ state.formError='الرجاء كتابة اسم المنتج'; render(); return; }
  if(!categoryId){ state.formError='أضف قسمًا أولاً من "الأقسام"'; render(); return; }
  if(productId){ Object.assign(state.data.products.find(x=>x.id===productId), {name, categoryId, price, stock, desc, image}); }
  else{ state.data.products.push({id:uid('p'), name, categoryId, branchId:activeBranchId(), price, stock, desc, image}); }
  state.formModal = null; state.formError=''; state.pendingImageData='';
  saveData(); 
  render();
  showToast(productId?'تم حفظ التعديلات':'تمت إضافة المنتج');
}
function deleteProduct(productId){
  state.data.products = state.data.products.filter(p=>p.id!==productId);
  saveData(); 
  render();
  showToast('تم حذف المنتج');
}

function panelEditProductsEmployee(){
  const list = state.data.products.filter(p=>p.branchId===activeBranchId());
  const rows = list.map(p=>{
    const cat = state.data.categories.find(c=>c.id===p.categoryId);
    return `<div class="list-row"><div class="l-main"><div class="t1">${escapeHtml(p.name)}</div>
      <div class="t2">${cat?escapeHtml(cat.name):'—'} · المخزون: ${p.stock}</div></div>
      <button class="icon-btn" onclick="openFormModal('empProduct','${p.id}')">✏️</button></div>`;
  }).join('') || `<div class="empty-note">لا توجد منتجات بعد</div>`;
  return `<div>${rows}</div>`;
}
function empProductFormHtml(productId){
  const p = state.data.products.find(x=>x.id===productId);
  if(!p) return modalWrap(`<button class="close-x" onclick="closeFormModal()">✕</button><div class="empty-note">هذا المنتج لم يعد موجودًا</div>`, 'closeFormModal()');
  return modalWrap(`<button class="close-x" onclick="closeFormModal()">✕</button><h2>تعديل المنتج</h2>
    <div class="field"><label>اسم المنتج</label><input id="epf-name" value="${escapeAttr(p.name)}"></div>
    <div class="field"><label>الكمية المتوفرة</label><input id="epf-stock" type="number" min="0" value="${p.stock}"></div>
    <div class="field"><label>وصف قصير (اختياري، 30 حرفًا كحد أقصى)</label><input id="epf-desc" maxlength="30" value="${escapeAttr(p.desc||'')}"></div>
    ${imagePickerHtml()}
    ${state.formError?`<div class="error-msg">${escapeHtml(state.formError)}</div>`:''}
    <button class="btn-primary" onclick="saveProductEmployee('${productId}')">حفظ</button>
    <button class="btn-secondary" onclick="closeFormModal()">إلغاء</button>`, 'closeFormModal()');
}
function saveProductEmployee(productId){
  const name = document.getElementById('epf-name').value.trim();
  const stock = parseInt(document.getElementById('epf-stock').value) || 0;
  const desc = document.getElementById('epf-desc').value.trim().slice(0,30);
  const image = state.pendingImageData || '';
  if(!name){ state.formError='الرجاء كتابة اسم المنتج'; render(); return; }
  Object.assign(state.data.products.find(x=>x.id===productId), {name, stock, desc, image});
  state.formModal = null; state.formError=''; state.pendingImageData='';
  saveData(); 
  render();
  showToast('تم حفظ التعديلات');
}

function panelCategories(){
  const list = branchCategories(activeBranchId());
  const rows = list.map(c=>{
    const count = state.data.products.filter(p=>p.categoryId===c.id).length;
    return `<div class="list-row"><div class="l-main"><div class="t1">${escapeHtml(c.name)}</div><div class="t2">${count} منتج</div></div>
      <button class="icon-btn" onclick="openFormModal('category','${c.id}')">✏️</button>
      <button class="icon-btn danger" onclick="deleteCategory('${c.id}')">🗑️</button></div>`;
  }).join('');
  return `<button class="btn-primary" onclick="openFormModal('category', null)">+ إضافة قسم جديد</button><div style="margin-top:16px;">${rows}</div>`;
}
function categoryFormHtml(catId){
  const c = catId ? state.data.categories.find(x=>x.id===catId) : {name:''};
  return modalWrap(`<button class="close-x" onclick="closeFormModal()">✕</button><h2>${catId?'تعديل اسم القسم':'قسم جديد'}</h2>
    <div class="field"><label>اسم القسم</label><input id="cf-name" value="${escapeAttr(c.name)}"></div>
    ${state.formError?`<div class="error-msg">${escapeHtml(state.formError)}</div>`:''}
    <button class="btn-primary" onclick="saveCategory(${catId?`'${catId}'`:null})">حفظ</button>
    <button class="btn-secondary" onclick="closeFormModal()">إلغاء</button>`, 'closeFormModal()');
}
function saveCategory(catId){
  const name = document.getElementById('cf-name').value.trim();
  if(!name){ state.formError='الرجاء كتابة اسم القسم'; render(); return; }
  if(catId){ state.data.categories.find(x=>x.id===catId).name = name; }
  else{ state.data.categories.push({id:uid('c'), name, branchId:activeBranchId()}); }
  state.formModal = null; state.formError='';
  saveData(); 
  render();
  showToast(catId?'تم حفظ التعديلات':'تمت إضافة القسم');
}
function deleteCategory(catId){
  if(state.data.products.some(p=>p.categoryId===catId)){ showToast('لا يمكن حذف قسم يحتوي على منتجات، انقل المنتجات أولاً','error'); return; }
  state.data.categories = state.data.categories.filter(c=>c.id!==catId);
  saveData(); 
  render();
  showToast('تم حذف القسم');
}

function panelBranches(){
  const rows = state.data.branches.map(b=>{
    const count = state.data.products.filter(p=>p.branchId===b.id).length;
    return `<div class="list-row"><div class="l-main"><div class="t1">${escapeHtml(b.name)}</div><div class="t2">${count} منتج</div></div>
      <button class="icon-btn" onclick="openFormModal('branch','${b.id}')">✏️</button>
      <button class="icon-btn danger" onclick="deleteBranch('${b.id}')">🗑️</button></div>`;
  }).join('') || `<div class="empty-note">لا توجد فروع بعد</div>`;
  return `<button class="btn-primary" onclick="openFormModal('branch', null)">+ إضافة فرع جديد</button><div style="margin-top:16px;">${rows}</div>`;
}
function branchFormHtml(branchId){
  const b = branchId ? state.data.branches.find(x=>x.id===branchId) : {name:'', mapsUrl:'', employeeCode:''};
  return modalWrap(`<button class="close-x" onclick="closeFormModal()">✕</button><h2>${branchId?'تعديل الفرع':'فرع جديد'}</h2>
    <div class="field"><label>اسم الفرع</label><input id="brf-name" value="${escapeAttr(b.name)}"></div>
    <div class="field"><label>رابط الموقع على خرائط جوجل</label><input id="brf-maps" value="${escapeAttr(b.mapsUrl||'')}" placeholder="https://maps.google.com/..."></div>
    <div class="field"><label>كود دخول الموظف لهذا الفرع (4 أرقام)</label><input id="brf-empcode" type="tel" inputmode="numeric" maxlength="4" value="${escapeAttr(b.employeeCode||'')}" placeholder="****"></div>
    ${state.formError?`<div class="error-msg">${escapeHtml(state.formError)}</div>`:''}
    <button class="btn-primary" onclick="saveBranch(${branchId?`'${branchId}'`:null})">حفظ</button>
    <button class="btn-secondary" onclick="closeFormModal()">إلغاء</button>`, 'closeFormModal()');
}
function saveBranch(branchId){
  const name = document.getElementById('brf-name').value.trim();
  const mapsUrl = document.getElementById('brf-maps').value.trim();
  const empCode = document.getElementById('brf-empcode').value.trim();
  if(!name){ state.formError='الرجاء كتابة اسم الفرع'; render(); return; }
  if(empCode && !/^[0-9]{4}$/.test(empCode)){ state.formError='كود الموظف يجب أن يتكون من 4 أرقام'; render(); return; }
  if(branchId){ Object.assign(state.data.branches.find(x=>x.id===branchId), {name, mapsUrl, employeeCode:empCode}); }
  else{ state.data.branches.push({id:uid('br'), name, mapsUrl, employeeCode:empCode}); }
  state.formModal = null; state.formError='';
  saveData(); 
  render();
  showToast(branchId?'تم حفظ التعديلات':'تمت إضافة الفرع');
}
function deleteBranch(branchId){
  if(state.data.products.some(p=>p.branchId===branchId)){ showToast('لا يمكن حذف فرع يحتوي على منتجات، انقل المنتجات أولاً','error'); return; }
  if(state.data.categories.some(c=>c.branchId===branchId)){ showToast('لا يمكن حذف فرع يحتوي على أقسام، احذف أقسامه أولاً','error'); return; }
  state.data.branches = state.data.branches.filter(b=>b.id!==branchId);
  saveData(); 
  render();
  showToast('تم حذف الفرع');
}

function panelBanners(){
  const list = state.data.banners.filter(b=>Array.isArray(b.branchIds) && b.branchIds.includes(activeBranchId()));
  const rows = list.map(b=>`<div class="list-row"><div class="l-main"><div class="t1">${escapeHtml(b.title)}</div><div class="t2">${escapeHtml(b.subtitle||'')}</div></div>
      <button class="icon-btn" onclick="openFormModal('banner','${b.id}')">✏️</button>
      <button class="icon-btn danger" onclick="deleteBanner('${b.id}')">🗑️</button></div>`).join('') || `<div class="empty-note">لا توجد بنرات بعد</div>`;
  return `<button class="btn-primary" onclick="openFormModal('banner', null)">+ إضافة بنر جديد</button><div style="margin-top:16px;">${rows}</div>`;
}
function bannerFormHtml(bannerId){
  const b = bannerId ? state.data.banners.find(x=>x.id===bannerId) : {title:'',subtitle:''};
  const brName = state.data.branches.find(x=>x.id===activeBranchId())?.name || '';
  return modalWrap(`<button class="close-x" onclick="closeFormModal()">✕</button><h2>${bannerId?'تعديل البنر':'بنر جديد'}</h2>
    <div class="field"><label>نص البنر الرئيسي</label><input id="bf-title" value="${escapeAttr(b.title)}"></div>
    <div class="field"><label>نص فرعي (اختياري)</label><input id="bf-subtitle" value="${escapeAttr(b.subtitle||'')}"></div>
    <p style="color:var(--brown-600); font-size:0.9rem; margin-bottom:10px;">سيظهر هذا البنر في فرعك: ${escapeHtml(brName)}</p>
    ${state.formError?`<div class="error-msg">${escapeHtml(state.formError)}</div>`:''}
    <button class="btn-primary" onclick="saveBanner(${bannerId?`'${bannerId}'`:null})">حفظ</button>
    <button class="btn-secondary" onclick="closeFormModal()">إلغاء</button>`, 'closeFormModal()');
}
function saveBanner(bannerId){
  const title = document.getElementById('bf-title').value.trim();
  const subtitle = document.getElementById('bf-subtitle').value.trim();
  if(!title){ state.formError='الرجاء كتابة نص البنر'; render(); return; }
  if(bannerId){
    const existing = state.data.banners.find(x=>x.id===bannerId);
    Object.assign(existing, {title, subtitle});
    if(!existing.branchIds.includes(activeBranchId())) existing.branchIds.push(activeBranchId());
  }else{
    state.data.banners.push({id:uid('b'), title, subtitle, branchIds:[activeBranchId()]});
  }
  state.formModal = null; state.formError='';
  saveData(); 
  render();
  showToast(bannerId?'تم حفظ التعديلات':'تمت إضافة البنر');
}
function deleteBanner(bannerId){
  state.data.banners = state.data.banners.filter(b=>b.id!==bannerId);
  saveData(); 
  render();
  showToast('تم حذف البنر');
}

function panelAdminSettings(){
  const s = state.data.settings;
  return `
    <div class="section-title">حساب المدير</div>
    <p style="color:var(--brown-600); font-size:0.9rem; margin-bottom:10px;">حساب واحد فقط يدير جميع الفروع. أكواد الموظفين تُحدَّد لكل فرع من "الفروع".</p>
    <div class="field"><label>كود المدير (4 أرقام)</label><input id="mgr-code" type="tel" inputmode="numeric" maxlength="4" value="${escapeAttr(s.managerCode||'')}"></div>
    <div class="section-title">إعدادات الحجز</div>
    <div class="field"><label>مدة الحجز قبل الإلغاء التلقائي (بالدقائق)</label><input id="res-minutes" type="number" min="5" value="${s.reservationMinutes}"></div>
    ${state.formError?`<div class="error-msg">${escapeHtml(state.formError)}</div>`:''}
    <button class="btn-primary" onclick="saveAdminSettings()">حفظ</button>
  `;
}
function saveAdminSettings(){
  const mgrEl = document.getElementById('mgr-code');
  const minEl = document.getElementById('res-minutes');
  if(!mgrEl || !minEl) return;
  const mgrCode = mgrEl.value.trim();
  if(!/^[0-9]{4}$/.test(mgrCode)){ state.formError='كود المدير يجب أن يتكون من 4 أرقام'; render(); return; }
  state.data.settings.managerCode = mgrCode;
  state.data.settings.reservationMinutes = parseInt(minEl.value) || 45;
  state.formError='';
  saveData(); 
  render();
  showToast('تم حفظ الإعدادات');
}

function panelStats(){
  const brName = state.data.branches.find(x=>x.id===activeBranchId())?.name || '';
  const orders = state.data.orders.filter(o=>o.branchId===activeBranchId());
  const confirmed = orders.filter(o=>o.status==='confirmed');
  const expired = orders.filter(o=>o.status==='expired');
  const pending = orders.filter(o=>o.status==='pending');
  const tally = {};
  confirmed.forEach(o=>o.items.forEach(it=>{
    const p = state.data.products.find(x=>x.id===it.productId);
    const name = p?p.name:'منتج محذوف';
    tally[name] = (tally[name]||0) + it.qty;
  }));
  const top = Object.entries(tally).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const rows = confirmed.slice().reverse().slice(0,20).map(o=>`<tr><td>#${o.number}</td><td>${escapeHtml(o.name)}</td><td>${escapeHtml(o.phone)}</td><td>${new Date(o.createdAt).toLocaleString('ar-SA')}</td></tr>`).join('');
  return `
    <div class="section-title">إحصائيات ${escapeHtml(brName)}</div>
    <div class="stat-grid">
      <div class="stat-card"><div class="num">${pending.length}</div><div class="lbl">حجوزات قيد الانتظار</div></div>
      <div class="stat-card"><div class="num">${confirmed.length}</div><div class="lbl">تم الاستلام</div></div>
      <div class="stat-card"><div class="num">${expired.length}</div><div class="lbl">حجوزات ملغاة</div></div>
      <div class="stat-card"><div class="num">${orders.length}</div><div class="lbl">إجمالي الحجوزات</div></div>
    </div>
    <div class="section-title">الأكثر طلبًا</div>
    ${top.length ? top.map(([n,q])=>`<div class="list-row"><div class="l-main t1">${escapeHtml(n)}</div><div>${q}</div></div>`).join('') : `<div class="empty-note">لا توجد بيانات كافية بعد</div>`}
    <div class="section-title">آخر الطلبات المستلمة</div>
    ${confirmed.length ? `<table><tr><th>رقم</th><th>الاسم</th><th>الهاتف</th><th>التاريخ</th></tr>${rows}</table>` : `<div class="empty-note">لا توجد طلبات مستلمة بعد</div>`}
  `;
}

function panelConfirmOrder(){
  const results = state.employeeSearchResults;
  return `
    <div class="field"><label>رقم هاتف العميل</label><input id="emp-phone" type="tel" inputmode="numeric" maxlength="10" value="${escapeAttr(state.employeeSearchPhone)}" placeholder="05xxxxxxxx"></div>
    <button class="btn-primary" onclick="searchOrderByPhone()">بحث</button>
    <div style="margin-top:18px;">
      ${results.length ? results.map(o=>renderEmployeeOrderCard(o)).join('') : (state.employeeSearchPhone ? `<div class="empty-note">لا توجد حجوزات قيد الانتظار لهذا الرقم</div>` : '')}
    </div>`;
}
function searchOrderByPhone(){
  const phoneEl = document.getElementById('emp-phone'); if(!phoneEl) return;
  const phone = phoneEl.value.trim();
  state.employeeSearchPhone = phone;
  state.employeeSearchResults = state.data.orders.filter(o=>o.phone===phone && o.status==='pending' && o.branchId===activeBranchId());
  render();
}
function renderEmployeeOrderCard(o){
  const itemsHtml = o.items.map(it=>{
    const p = state.data.products.find(x=>x.id===it.productId);
    return `<div class="order-items">• ${p?escapeHtml(p.name):'منتج محذوف'} × ${it.qty}</div>`;
  }).join('');
  const remaining = Math.max(0, Math.round((o.expiresAt - Date.now())/60000));
  return `<div class="list-row" style="flex-direction:column; align-items:stretch;">
    <div class="t1">حجز رقم #${o.number} — ${escapeHtml(o.name)}</div>
    <div class="t2">${escapeHtml(o.phone)} · متبقٍ ${remaining} دقيقة</div>
    ${itemsHtml}
    <button class="btn-primary" style="margin-top:10px;" onclick="confirmOrder('${o.id}')">تأكيد الاستلام</button></div>`;
}
function confirmOrder(orderId){
  const o = state.data.orders.find(x=>x.id===orderId);
  if(!o) return;
  o.status = 'confirmed';
  o.confirmedAt = Date.now();
  saveData();
  state.employeeSearchResults = state.data.orders.filter(x=>x.phone===state.employeeSearchPhone && x.status==='pending' && x.branchId===activeBranchId());
  render();
  showToast('تم تأكيد استلام الطلب');
}

function escapeHtml(str){ return String(str).replace(/[&<>"']/g, s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s])); }
function escapeAttr(str){ return escapeHtml(str); }

loadData();
</script>
</body>
</html>
